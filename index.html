<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Cake Forge - Kitchen Hub Portal</title>
    <style>
        :root {
            --bg-dark: #121212;
            --surface: #1e1e1e;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --brand-green: #00b0ff;
            --border: #383838;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .portal-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 30px; width: 100%; max-width: 450px; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        h1 { font-size: 1.5rem; color: var(--brand-green); margin-bottom: 8px; letter-spacing: 1px; }
        p { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 24px; }
        .btn-launch { display: inline-block; background-color: var(--brand-green); color: #000; font-weight: bold; text-decoration: none; padding: 12px 24px; border-radius: 6px; font-size: 0.95rem; width: 100%; transition: opacity 0.2s; }
        .btn-launch:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="portal-card">
        <h1>THE CAKE FORGE</h1>
        <p>Bespoke Cake Decorating & Kitchen Management</p>
        <!-- Direct link to the kitchen console inside the hub folder -->
        <a href="hub/kitchen-console.html" class="btn-launch">🚀 Launch Kitchen Console</a>
    </div>
</body>
</html>
