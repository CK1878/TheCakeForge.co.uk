<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bespoke Cake Valuation System | The Cake Forge</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --border: #334155;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #34d399;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 20px;
      max-width: 720px;
      margin: 0 auto;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    }
    h2 {
      margin-top: 0;
      color: var(--accent);
      font-size: 1.4rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }
    .badge {
      font-size: 0.75rem;
      background: #334155;
      color: var(--text-muted);
      padding: 3px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
    }
    .badge.active {
      background: #0284c7;
      color: #fff;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 20px;
    }
    @media (max-width: 520px) {
      .grid { grid-template-columns: 1fr; }
    }
    .form-group {
      display: flex;
      flex-direction: column;
    }
    .form-group.full {
      grid-column: 1 / -1;
    }
    label {
      font-weight: 600;
      font-size: 0.85rem;
      margin-bottom: 6px;
      color: var(--text-muted);
    }
    input, select {
      background-color: #0f172a;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px;
      border-radius: 6px;
      font-size: 0.95rem;
      width: 100%;
      box-sizing: border-box;
    }
    input:focus, select:focus {
      outline: 2px solid var(--accent);
      border-color: transparent;
    }
    .results-container {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }
    .price-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
    }
    .price-card.bordered {
      border-bottom: 1px solid var(--border);
    }
    .price-title {
      font-size: 0.9rem;
      font-weight: 600;
    }
    .price-sub {
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    .val-public {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--accent);
    }
    .val-mates {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--success);
    }
    /* Hidden Staff Mode Styling */
    .staff-only {
      display: none; /* Hidden by default */
    }
    .internal-stats {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px dashed var(--border);
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .btn-copy {
      margin-top: 16px;
      width: 100%;
      background: var(--accent);
      color: #0f172a;
      border: none;
      padding: 12px;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: opacity 0.2s;
    }
    .btn-copy:hover {
      opacity: 0.9;
    }
    .footer-stealth {
      margin-top: 20px;
      text-align: center;
      font-size: 0.75rem;
      color: #334155;
    }
    .stealth-link {
      cursor: pointer;
      text-decoration: none;
      color: inherit;
    }
  </style>
</head>
<body>

<div class="panel">
  <h2 onclick="handleTitleClick()">
    Bespoke Cake Calculator 
    <span class="badge" id="modeBadge" onclick="promptPin()">Public View</span>
  </h2>
  
  <div class="grid">
    <div class="form-group">
      <label for="guests">Target Guests / Portions</label>
      <input type="number" id="guests" value="30" min="10" max="200" oninput="calculateQuote()">
    </div>

    <div class="form-group">
      <label for="tiers">Number of Tiers</label>
      <select id="tiers" onchange="calculateQuote()">
        <option value="1">1 Tier</option>
        <option value="2" selected>2 Tiers</option>
        <option value="3">3 Tiers</option>
      </select>
    </div>

    <div class="form-group full">
      <label for="complexity">Design & Structural Complexity</label>
      <select id="complexity" onchange="calculateQuote()">
        <option value="standard">Standard Round (Smooth Ganache / Fondant Finish)</option>
        <option value="sculpted">Sculpted Topper / Detailed Hand Modeling (+£25)</option>
        <option value="structural">Full 3D Structural Build / Custom Armature (+£65)</option>
      </select>
    </div>

    <div class="form-group">
      <label for="flavor">Flavor Profile</label>
      <select id="flavor" onchange="calculateQuote()">
        <option value="1.0">Standard (Madagascar Vanilla / Chocolate Ganache)</option>
        <option value="1.15">Premium (Salted Caramel / Raspberry & White Choc)</option>
        <option value="1.25">Exotic / Fruit & Nut Inclusions</option>
      </select>
    </div>

    <div class="form-group">
      <label for="toppers">Custom Acrylic / Name Topper (£)</label>
      <input type="number" id="toppers" value="12" min="0" oninput="calculateQuote()">
    </div>

    <div class="form-group full">
      <label for="delivery">Delivery Distance (Miles 1-way from Carlisle)</label>
      <input type="number" id="delivery" value="5" min="0" oninput="calculateQuote()">
    </div>
  </div>

  <div class="results-container">
    <!-- Public Retail Quote (Always Visible) -->
    <div class="price-card" id="retailCard">
      <div>
        <div class="price-title">Estimated Bespoke Quote</div>
        <div class="price-sub">Includes full structural design, packaging & delivery</div>
      </div>
      <div class="val-public" id="publicPrice">£0.00</div>
    </div>

    <!-- Hidden Mates Rates (Unlocked via PIN or Ctrl+M) -->
    <div class="price-card staff-only" id="matesCard">
      <div>
        <div class="price-title">Friends & Family Rate</div>
        <div class="price-sub">Covers materials, power + £10/hr labor</div>
      </div>
      <div class="val-mates" id="matesPrice">£0.00</div>
    </div>

    <!-- Hidden Internal Stats -->
    <div class="internal-stats staff-only" id="internalStats"></div>
  </div>

  <button class="btn-copy" onclick="copyClientMessage()">Copy Quote Summary</button>
</div>

<div class="footer-stealth">
  The Cake Forge © 2026 | <span class="stealth-link" onclick="promptPin()">Admin</span>
</div>

<script>
let globalRetail = 0;
let globalPortions = 0;
let globalTiers = 1;
let isStaffMode = false;
const STAFF_PIN = "1234"; // CHANGE YOUR UNLOCK PIN HERE

function calculateQuote() {
  const guests = parseFloat(document.getElementById('guests').value) || 0;
  const tiers = parseInt(document.getElementById('tiers').value) || 1;
  const complexity = document.getElementById('complexity').value;
  const flavorMultiplier = parseFloat(document.getElementById('flavor').value) || 1.0;
  const topperCost = parseFloat(document.getElementById('toppers').value) || 0;
  const deliveryMiles = parseFloat(document.getElementById('delivery').value) || 0;

  // Base Costs
  const baseIngredientPerPortion = 1.25 * flavorMultiplier;
  const tierHardware = 6.50; 
  const hourlyLabor = 15.00;
  const mileageAllowance = 0.45; 
  const fixedOverhead = 9.00; 

  let estimatedHours = 2.5 + (tiers * 1.5);
  let complexityHardware = 0;

  if (complexity === 'sculpted') {
    estimatedHours += 2.0;
    complexityHardware = 12.00;
  } else if (complexity === 'structural') {
    estimatedHours += 4.5;
    complexityHardware = 30.00;
  }

  const cogsIngredients = guests * baseIngredientPerPortion;
  const cogsHardware = (tiers * tierHardware) + complexityHardware + topperCost;
  const cogsDelivery = (deliveryMiles * 2) * mileageAllowance;
  const laborCost = estimatedHours * hourlyLabor;

  const totalBaseCost = cogsIngredients + cogsHardware + fixedOverhead + cogsDelivery + laborCost;

  // Retail Price (30% Margin)
  const retailPrice = totalBaseCost / (1 - 0.30);

  // Mates Rates (COGS + £10/hr Labor)
  const matesLabor = estimatedHours * 10.00;
  const matesPrice = cogsIngredients + cogsHardware + fixedOverhead + cogsDelivery + matesLabor;

  globalRetail = retailPrice.toFixed(2);
  globalPortions = guests;
  globalTiers = tiers;

  document.getElementById('publicPrice').innerText = '£' + retailPrice.toFixed(2);
  document.getElementById('matesPrice').innerText = '£' + matesPrice.toFixed(2);

  document.getElementById('internalStats').innerHTML = 
    `<span>Est. Production: <strong>${estimatedHours.toFixed(1)} hrs</strong></span>` +
    `<span>Raw COGS: <strong>£${(cogsIngredients + cogsHardware).toFixed(2)}</strong></span>` +
    `<span>Delivery Fee: <strong>£${cogsDelivery.toFixed(2)}</strong></span>`;
}

// Stealth Toggle Functions
function toggleStaffMode() {
  isStaffMode = !isStaffMode;
  const staffElements = document.querySelectorAll('.staff-only');
  const badge = document.getElementById('modeBadge');
  const retailCard = document.getElementById('retailCard');

  staffElements.forEach(el => {
    el.style.display = isStaffMode ? 'flex' : 'none';
  });

  if (isStaffMode) {
    badge.innerText = "Staff Unlocked";
    badge.classList.add('active');
    retailCard.classList.add('bordered');
  } else {
    badge.innerText = "Public View";
    badge.classList.remove('active');
    retailCard.classList.remove('bordered');
  }
}

function promptPin() {
  if (isStaffMode) {
    toggleStaffMode(); // Lock if already unlocked
    return;
  }
  const input = prompt("Enter Staff Security PIN:");
  if (input === STAFF_PIN) {
    toggleStaffMode();
  } else if (input !== null) {
    alert("Incorrect PIN");
  }
}

// Keyboard Shortcut (Ctrl + M)
document.addEventListener('keydown', function(e) {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'm') {
    e.preventDefault();
    toggleStaffMode();
  }
});

// Triple Click Header Unlock
let clickCount = 0;
let clickTimer;
function handleTitleClick() {
  clickCount++;
  clearTimeout(clickTimer);
  if (clickCount === 3) {
    toggleStaffMode();
    clickCount = 0;
  } else {
    clickTimer = setTimeout(() => { clickCount = 0; }, 500);
  }
}

function copyClientMessage() {
  const text = `Hi! Thanks so much for reaching out. Based on your cake specification (${globalPortions} portions, ${globalTiers}-tier design), our system has calculated your bespoke quote at £${globalRetail}. This includes all custom structural setup, packaging, and delivery. Let us know if you'd like to secure this date on our calendar!`;
  
  navigator.clipboard.writeText(text);
  alert("Client quote text copied to clipboard!");
}

// Initial Calculation
calculateQuote();
</script>

</body>
</html>
