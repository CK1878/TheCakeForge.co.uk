<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Cake Forge - Commission Pricing Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        charcoal: '#111111',
                        surface: '#1E1E1E',
                        surfaceAccent: '#2A2A2A',
                        copper: '#B87333',
                        forgeGlow: '#FF8C33',
                        brandBlue: '#00B0FF'
                    },
                    fontFamily: {
                        primary: ['Cinzel', 'serif'],
                        secondary: ['Montserrat', 'sans-serif']
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-charcoal text-stone-200 font-secondary min-h-screen p-4 md:p-8 flex flex-col justify-between">

    <!-- Header Navigation -->
    <header class="max-w-6xl mx-auto w-full bg-surface border border-stone-800 rounded-lg p-5 mb-8 flex justify-between items-center flex-wrap gap-4">
        <div>
            <h1 class="font-primary text-xl font-bold tracking-wider text-brandBlue">THE CAKE FORGE</h1>
            <p class="text-xs uppercase tracking-widest text-copper">Bespoke Commission Pricing & Quoting Engine</p>
        </div>
        <div class="flex items-center gap-3">
            <a href="recipe-library.html" class="bg-surfaceAccent hover:bg-stone-800 border border-stone-700 text-stone-300 text-xs px-3 py-2 rounded transition">Recipe Library</a>
            <a href="inventory.html" class="bg-surfaceAccent hover:bg-stone-800 border border-stone-700 text-stone-300 text-xs px-3 py-2 rounded transition">Inventory Hub</a>
            <a href="index.html" class="bg-copper/20 border border-copper text-copper hover:bg-copper hover:text-white text-xs px-3 py-2 rounded transition">&larr; Staff Hub</a>
        </div>
    </header>

    <main class="max-w-6xl mx-auto w-full grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- Left Column: Input Form (8 cols) -->
        <div class="lg:col-span-7 space-y-6">

            <!-- 1. Recipe & Edibles Selection -->
            <section class="bg-surface border border-stone-800 rounded-lg p-6 space-y-4">
                <div class="border-b border-stone-800 pb-3 flex justify-between items-center">
                    <h2 class="font-primary text-lg text-white font-bold">1. Sponges & Fillings (Recipe Costs)</h2>
                    <span class="text-xs text-copper font-mono">Aldi & Callebaut Ledger Linked</span>
                </div>

                <div class="space-y-3">
                    <div>
                        <label class="text-xs text-stone-400 font-bold uppercase block mb-1">Base Sponge Batch</label>
                        <select id="select-sponge" onchange="calculateQuote()" class="w-full bg-charcoal border border-stone-700 rounded p-2.5 text-sm text-white focus:border-brandBlue focus:outline-none">
                            <option value="5.99">Standard Vanilla Sponge (3x 8" Pans) - £5.99</option>
                            <option value="2.52">Structured Vanilla Sponge (2x 8" Pans) - £2.52</option>
                            <option value="1.71">Chocolate Cake (2x 6" Pans) - £1.71</option>
                            <option value="17.90">Heavy Chocolate Fudge (2x 12" Pans) - £17.90</option>
                            <option value="5.90">Red Velvet Cake (3x 8" Pans) - £5.90</option>
                        </select>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="text-xs text-stone-400 font-bold uppercase block mb-1">Batch Scaling Multiplier</label>
                            <input type="number" id="sponge-multiplier" value="1" min="0.5" step="0.5" oninput="calculateQuote()" class="w-full bg-charcoal border border-stone-700 rounded p-2 text-sm text-white">
                        </div>
                        <div>
                            <label class="text-xs text-stone-400 font-bold uppercase block mb-1">Flavor Enhancements</label>
                            <select id="select-flavor" onchange="calculateQuote()" class="w-full bg-charcoal border border-stone-700 rounded p-2 text-sm text-white">
                                <option value="0">Standard / Vanilla (£0.00)</option>
                                <option value="0.60">Lemon Zest (+£0.60)</option>
                                <option value="1.07">Freeze-Dried Strawberry (+£1.07)</option>
                                <option value="0.60">Chocolate Orange Zest (+£0.60)</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="text-xs text-stone-400 font-bold uppercase block mb-1
