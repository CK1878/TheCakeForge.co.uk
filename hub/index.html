<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Cake Forge - Staff Kitchen Hub</title>
    <style>
        :root {
            --bg-dark: #121212;
            --surface: #1e1e1e;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --brand-green: #00b0ff;
            --copper: #B87333;
            --border: #383838;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .hub-container { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 30px; width: 100%; max-width: 500px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        h1 { font-size: 1.4rem; color: var(--brand-green); margin-bottom: 6px; letter-spacing: 1px; text-transform: uppercase; }
        p { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 24px; }
        .nav-links { display: flex; flex-direction: column; gap: 12px; }
        .hub-btn { display: flex; align-items: center; justify-content: space-between; background: #2a2a2a; border: 1px solid var(--border); color: #fff; text-decoration: none; padding: 14px 18px; border-radius: 8px; font-weight: bold; font-size: 0.9rem; transition: all 0.2s; }
        .hub-btn:hover { border-color: var(--brand-green); background: #333; }
        .hub-btn span { color: var(--brand-green); font-size: 0.75rem; text-transform: uppercase; border: 1px solid var(--brand-green); padding: 3px 8px; border-radius: 4px; }
        .back-link { display: block; text-align: center; margin-top: 20px; font-size: 0.75rem; color: var(--text-muted); text-decoration: none; }
        .back-link:hover { color: #fff; }
    </style>
</head>
<body>
    <div class="hub-container">
        <h1>Kitchen Management Hub</h1>
        <p>Select an operational tool or HACCP console below:</p>
        
        <div class="nav-links">
            <a href="kitchen-console.html" class="hub-btn">
                <span>HACCP & SFBB Log</span>
                <span>Launch →</span>
            </a>
            <a href="cake-calculator.html" class="hub-btn">
                <span>Recipe Tin Scaler</span>
                <span>Launch →</span>
            </a>
            <a href="cake-pricing-app.html" class="hub-btn">
                <span>Bespoke Valuation System</span>
                <span>Launch →</span>
            </a>
        </div>

        <a href="../index.html" class="back-link">← Return to Public Website</a>
    </div>
</body>
</html>
