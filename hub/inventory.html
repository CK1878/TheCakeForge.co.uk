<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Cake Forge - Inventory & Stock Management</title>
    <!-- HTML5 QR / Barcode Scanner Engine -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    
    <style>
        :root {
            --bg-dark: #121212;
            --surface: #1e1e1e;
            --surface-accent: #2a2a2a;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --brand-green: #00b0ff; 
            --copper: #B87333;
            --alert-amber: #ff9100;
            --alert-red: #ff3d00;
            --success: #00e676;
            --border: #383838;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; padding: 10px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }

        header {
            background-color: var(--surface); border-radius: 8px; display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; border-bottom: 2px solid var(--surface-accent); flex-wrap: wrap; gap: 10px;
        }

        .brand h1 { font-size: 1.3rem; color: var(--brand-green); letter-spacing: 1px; }
        .brand p { font-size: 0.75rem; color: var(--text-muted); }
        .header-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        
        .staff-selector-box { background: var(--surface-accent); border: 1px solid var(--copper); padding: 6px 12px; border-radius: 6px; display: flex; align-items: center; gap: 8px; }
        .staff-selector-box label { font-size: 0.7rem; text-transform: uppercase; font-weight: bold; color: var(--copper); }
        .staff-select { background: #121212; color: #fff; border: 1px solid var(--border); padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; cursor: pointer; }

        main { display: flex; flex-direction: column; gap: 15px; width: 100%; max-width: 1200px; margin: 0 auto; }

        .panel { background-color: var(--surface); border-radius: 8px; padding: 15px; display: flex; flex-direction: column; border: 1px solid var(--border); }
        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); gap: 5px; }
        h2 { font-size: 1rem; text-transform: uppercase; letter-spacing: 0.5px; }

        .add-task-box { background: var(--surface-accent); padding: 12px; border-radius: 6px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 8px; }
        .add-task-row { display: flex; gap: 8px; flex-wrap: wrap; }
        .add-task-input { flex-grow: 1; background: #121212; border: 1px solid var(--border); color: #fff; padding: 8px; border-radius: 4px; font-size: 0.85rem; min-width: 140px; }
        .add-task-select { background: #121212; border: 1px solid var(--border); color: #fff; padding: 8px; border-radius: 4px; font-size: 0.85rem; }

        .spreadsheet-container { width: 100%; overflow-x: auto; border: 1px solid var(--border); border-radius: 4px; margin-top: 5px; }
        table.ledger { width: 100%; border-collapse: collapse; font-size: 0.85rem; text-align: left; min-width: 650px; }
        table.ledger th { background-color: #252525; color: var(--text-main); padding: 10px 8px; font-weight: 600; border-bottom: 2px solid var(--border); border-right: 1px solid var(--border); }
        table.ledger td { padding: 10px 8px; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); background-color: var(--surface); }
        table.ledger tr:nth-child(even) td { background-color: #222; }

        .btn-action { background-color: var(--brand-green); color: #000; border: none; padding: 10px 16px; font-weight: bold; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
        .btn-secondary { background-color: #444; color: #fff; border: none; padding: 10px 16px; font-weight: bold; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
        .btn-print { background-color: var(--copper); color: #fff; border: none; padding: 4px 8px; font-size: 0.75rem; font-weight: bold; border-radius: 4px; cursor: pointer; }

        #camera-scanner-view { width: 100%; max-width: 400px; margin: 8px 0; border-radius: 6px; overflow: hidden; border: 2px solid var(--brand-green); display: none; }
        .ingredient-tag { display: inline-block; background: #333; color: var(--brand-green); font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; margin: 2px 2px 2px 0; border: 1px solid #444; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; z-index: 1000; padding: 15px; }
        .modal-card { background: var(--surface); border: 2px solid var(--brand-green); border-radius: 8px; width: 100%; max-width: 500px; padding: 20px; display: flex; flex-direction: column; gap: 14px; max-height: 90vh; overflow-y: auto; }
        .modal-card h3 { color: var(--brand-green); font-size: 1.1rem; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
        .modal-form-group { display: flex; flex-direction: column; gap: 4px; }
        .modal-form-group label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; font-weight: bold; }
        .allergen-chip-grid { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
        .allergen-chip { background: #121212; color: var(--text-muted); border: 1px solid var(--border); padding: 4px 10px; font-size: 0.75rem; border-radius: 12px; cursor: pointer; user-select: none; }
        .allergen-chip.selected { background: var(--alert-red); color: white; border-color: var(--alert-red); font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <h1>THE CAKE FORGE</h1>
            <p>Inventory & Stock Management Hub</p>
        </div>

        <div class="header-actions">
            <div class="staff-selector-box">
                <label for="active-staff-select">Operator:</label>
                <select id="active-staff-select" class="staff-select" onchange="updateActiveStaff()">
                    <option value="Primary Baker">Primary Baker</option>
                    <option value="Secondary Baker">Secondary Baker</option>
                </select>
            </div>
            <a href="kitchen-console.html" class="btn-secondary" style="text-decoration:none; text-align:center;">Kitchen Console</a>
        </div>
    </header>

    <main>
        <!-- MASTER INVENTORY & PANTRY STOCK -->
        <section class="panel">
            <div class="panel-header">
                <h2>Active Opened Pantry Stock</h2>
            </div>

            <div class="add-task-box">
                <span style="font-size:0.75rem; font-weight:bold; color:var(--brand-green);">+ SCAN OR ADD INGREDIENT TO PANTRY</span>
                <div class="add-task-row">
                    <input type="text" id="barcode-input" class="add-task-input" placeholder="Scan Barcode (EAN) or Type Name..." style="flex-grow:2;">
                    <button class="btn-action" onclick="fetchAndReviewProduct()">Scan & Review</button>
                    <button class="btn-secondary" id="btn-cam-toggle" onclick="toggleCameraScanner()">📷 Camera</button>
                </div>
                <div id="camera-scanner-view"></div>
            </div>

            <div class="spreadsheet-container">
                <table class="ledger">
                    <thead>
                        <tr>
                            <th>Opened Date</th>
                            <th>Ingredient Description</th>
                            <th>14 Allergens</th>
                            <th>Expiry Date</th>
                            <th>Operator</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="inventory-ledger-body">
                        <tr>
                            <td colspan="6" style="text-align:center; color:var(--text-muted); padding:20px;">Connecting to Firestore Inventory...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- PRODUCT REVIEW & EDIT MODAL -->
    <div class="modal-overlay" id="product-modal" style="display: none;">
        <div class="modal-card">
            <h3>Review / Edit Product Details</h3>
            
            <div class="modal-form-group">
                <label>Product Name</label>
                <input type="text" id="modal-name" class="add-task-input" placeholder="e.g., Callebaut 811 Dark Callets">
            </div>

            <div class="modal-form-group">
                <label>Barcode / EAN</label>
                <input type="text" id="modal-code" class="add-task-input">
            </div>

            <div class="modal-form-group">
                <label>Shelf Life Method</label>
                <div style="display:flex; gap:8px;">
                    <button type="button" class="btn-action" id="btn-mode-days" onclick="setExpiryInputMode('days')" style="flex:1;">Days Preset</button>
                    <button type="button" class="btn-secondary" id="btn-mode-date" onclick="setExpiryInputMode('date')" style="flex:1;">Calendar Date</button>
                </div>
            </div>

            <div class="modal-form-group" id="container-expiry-days">
                <label>Shelf Life (Days)</label>
                <input type="number" id="modal-pao-days" class="add-task-input" value="30" style="max-width: 140px;">
                <div style="display:flex; flex-wrap:wrap; gap:6px; margin-top:6px;">
                    <button type="button" class="btn-secondary" style="padding:4px 8px; font-size:0.7rem;" onclick="setPresetDays(7)">7 Days</button>
                    <button type="button" class="btn-secondary" style="padding:4px 8px; font-size:0.7rem;" onclick="setPresetDays(14)">14 Days</button>
                    <button type="button" class="btn-secondary" style="padding:4px 8px; font-size:0.7rem;" onclick="setPresetDays(30)">30 Days</button>
                    <button type="button" class="btn-secondary" style="padding:4px 8px; font-size:0.7rem;", onclick="setPresetDays(90)">90 Days</button>
                    <button type="button" class="btn-secondary" style="padding:4px 8px; font-size:0.7rem;" onclick="setPresetDays(365)">365 Days</button>
                </div>
            </div>

            <div class="modal-form-group" id="container-expiry-date" style="display:none;">
                <label>Exact Expiry Date</label>
                <input type="date" id="modal-pao-date" class="add-task-input" style="max-width: 200px; color-scheme: dark;">
            </div>

            <div class="modal-form-group">
                <label>Flagged Allergens (Click to Toggle)</label>
                <div class="allergen-chip-grid" id="modal-allergen-grid"></div>
            </div>

            <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px;">
                <button class="btn-secondary" onclick="closeProductModal()">Cancel</button>
                <button class="btn-action" onclick="saveProductToFirestore()">Save to Inventory</button>
            </div>
        </div>
    </div>

    <!-- FIREBASE & APP SCRIPT -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import {  
            getFirestore,  
            collection,  
            addDoc,  
            onSnapshot,  
            query,  
            orderBy,  
            enableIndexedDbPersistence  
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBdrhFnnekXeZRuIGLcjeDwGtoBaQByck8",
            authDomain: "cake-forge-haccp.firebaseapp.com",
            projectId: "cake-forge-haccp",
            storageBucket: "cake-forge-haccp.firebasestorage.app",
            messagingSenderId: "759565273648",
            appId: "1:759565273648:web:6c16761183727fc87a7bf5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        enableIndexedDbPersistence(db, { synchronizeTabs: true }).catch(() => {});

        window.db = db;
        window.collection = collection;
        window.addDoc = addDoc;
        window.onSnapshot = onSnapshot;
        window.query = query;
        window.orderBy = orderBy;

        window.dbCollections = {
            openedIngredients: collection(db, "openedIngredients")
        };

        onSnapshot(query(window.dbCollections.openedIngredients, orderBy("timestamp", "desc")), (snapshot) => {
            const inventory = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            renderInventoryTable(inventory);
        });
    </script>

    <script>
        const BARCODE_DB = {
            "5010029000148": { name: "Self Raising Flour 1.5kg", defaultDays: 90, allergens: ["Gluten"] },
            "5000128001234": { name: "Callebaut 811 Dark Callets", defaultDays: 365, allergens: ["Soya", "Milk"] },
            "5010011000010": { name: "Icing Sugar 1kg", defaultDays: 180, allergens: [] },
            "5060105310002": { name: "Two Chicks Liquid Egg Whites", defaultDays: 7, allergens: ["Eggs"] }
        };

        const ALLERGEN_LIST = [
            "Eggs", "Milk", "Gluten", "Soya", "Nuts", "Peanuts", "Sesame", 
            "Celery", "Mustard", "Lupin", "Sulphites", "Fish", "Crustaceans", "Molluscs"
        ];

        let modalSelectedAllergens = new Set();
        let html5QrCode = null;
        let activeExpiryMode = 'days';
        let activeStaff = "Primary Baker";

        function updateActiveStaff() {
            activeStaff = document.getElementById('active-staff-select').value;
        }

        function renderInventoryTable(items) {
            const tbody = document.getElementById('inventory-ledger-body');
            if (!items.length) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:var(--text-muted); padding:20px;">No active pantry stock recorded.</td></tr>`;
                return;
            }

            tbody.innerHTML = items.map(item => {
                const allergenHtml = (item.allergens || []).map(a => `<span class="ingredient-tag">${a}</span>`).join(' ') || '<span style="color:#666;">None</span>';
                return `
                    <tr>
                        <td style="font-variant-numeric:tabular-nums;">${item.timestamp || '---'}</td>
                        <td style="font-weight:600;">${item.name}</td>
                        <td>${allergenHtml}</td>
                        <td style="color:var(--success); font-weight:bold; font-variant-numeric:tabular-nums;">${item.expiryDate}</td>
                        <td>${item.staff || 'Primary Baker'}</td>
                        <td>
                            <button class="btn-print" onclick="alert('Print label simulation for: ${item.name}')">🖨️ Label</button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // Initialize Allergen Grid
        const grid = document.getElementById('modal-allergen-grid');
        grid.innerHTML = ALLERGEN_LIST.map(alg => `
            <div class="allergen-chip" id="chip-${alg}" onclick="toggleModalAllergen('${alg}')">${alg}</div>
        `).join('');

        function toggleModalAllergen(alg) {
            if (modalSelectedAllergens.has(alg)) {
                modalSelectedAllergens.delete(alg);
                document.getElementById(`chip-${alg}`).classList.remove('selected');
            } else {
                modalSelectedAllergens.add(alg);
                document.getElementById(`chip-${alg}`).classList.add('selected');
            }
        }

        function setExpiryInputMode(mode) {
            activeExpiryMode = mode;
            if (mode === 'days') {
                document.getElementById('container-expiry-days').style.display = 'flex';
                document.getElementById('container-expiry-date').style.display = 'none';
                document.getElementById('btn-mode-days').className = 'btn-action';
                document.getElementById('btn-mode-date').className = 'btn-secondary';
            } else {
                document.getElementById('container-expiry-days').style.display = 'none';
                document.getElementById('container-expiry-date').style.display = 'flex';
                document.getElementById('btn-mode-date').className = 'btn-action';
                document.getElementById('btn-mode-days').className = 'btn-secondary';
            }
        }

        function setPresetDays(days) {
            document.getElementById('modal-pao-days').value = days;
        }

        function fetchAndReviewProduct() {
            const val = document.getElementById('barcode-input').value.trim();
            if (!val) {
                alert("Please enter a barcode or ingredient name.");
                return;
            }

            let match = BARCODE_DB[val] || { name: val, defaultDays: 30, allergens: [] };
            
            document.getElementById('modal-name').value = match.name;
            document.getElementById('modal-code').value = val;
            document.getElementById('modal-pao-days').value = match.defaultDays;
            
            modalSelectedAllergens.clear();
            document.querySelectorAll('.allergen-chip').forEach(el => el.classList.remove('selected'));
            (match.allergens || []).forEach(alg => {
                modalSelectedAllergens.add(alg);
                const chip = document.getElementById(`chip-${alg}`);
                if (chip) chip.classList.add('selected');
            });

            setExpiryInputMode('days');
            document.getElementById('product-modal').style.display = 'flex';
        }

        function closeProductModal() {
            document.getElementById('product-modal').style.display = 'none';
        }

        async function saveProductToFirestore() {
            const name = document.getElementById('modal-name').value.trim();
            const code = document.getElementById('modal-code').value.trim();
            if (!name) {
                alert("Product name is required.");
                return;
            }

            let expiryDateStr = "";
            const now = new Date();

            if (activeExpiryMode === 'days') {
                const days = parseInt(document.getElementById('modal-pao-days').value) || 7;
                const exp = new Date();
                exp.setDate(now.getDate() + days);
                expiryDateStr = exp.toLocaleDateString('en-GB');
            } else {
                const dateVal = document.getElementById('modal-pao-date').value;
                if (!dateVal) {
                    alert("Please select a valid expiry date.");
                    return;
                }
                expiryDateStr = new Date(dateVal).toLocaleDateString('en-GB');
            }

            const payload = {
                name: name,
                barcode: code || "MANUAL",
                allergens: Array.from(modalSelectedAllergens),
                expiryDate: expiryDateStr,
                timestamp: now.toLocaleDateString('en-GB'),
                staff: activeStaff
            };

            try {
                await window.addDoc(window.dbCollections.openedIngredients, payload);
                closeProductModal();
                document.getElementById('barcode-input').value = "";
            } catch (err) {
                console.error("Error saving inventory item:", err);
                alert("Failed to save to Firestore. Check console.");
            }
        }

        function toggleCameraScanner() {
            const container = document.getElementById('camera-scanner-view');
            if (container.style.display === 'block') {
                if (html5QrCode) html5QrCode.stop().catch(() => {});
                container.style.display = 'none';
                return;
            }

            container.style.display = 'block';
            html5QrCode = new Html5Qrcode("camera-scanner-view");
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 100 } },
                (decodedText) => {
                    document.getElementById('barcode-input').value = decodedText;
                    html5QrCode.stop().catch(() => {});
                    container.style.display = 'none';
                    fetchAndReviewProduct();
                },
                () => {}
            ).catch(err => {
                alert("Camera initialization failed: " + err);
                container.style.display = 'none';
            });
        }
    </script>
</body>
</html>
